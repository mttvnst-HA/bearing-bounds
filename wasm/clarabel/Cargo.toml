[package]
name = "clarabel-bb"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Minimal WebAssembly binding of the Clarabel conic solver for Bearing Bounds. Returns the primal and dual point for every solver status."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
clarabel = "=0.11.1"
wasm-bindgen = "=0.2.100"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
